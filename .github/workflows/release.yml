# FR-27：打 tag v* → 三平台桌面安装包 → GitHub Releases（electron-builder --publish）。
# 无代码签名（证书凭据待补）——Win SmartScreen / macOS Gatekeeper 会告警。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # anycode-core 包（FR-27 批 3）：server.mjs + web dist + launcher —— install.sh 的
  # 预编译快路径（跳过 pnpm install/现场构建）；追加资产到同 tag 的 Release。
  core-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web + server
        run: |
          pnpm --filter @any-code/web build
          pnpm --filter @any-code/server build
      - name: Vendor rg
        run: |
          mkdir -p rg-out
          find node_modules/.pnpm -type f -name rg -path '*linux-x64*ripgrep*' | head -1 > rg.path
          cp "$(cat rg.path)" rg-out/rg && chmod +x rg-out/rg
      - name: Pack core tar（布局镜像 ~/.anycode/app + rg）
        run: |
          STAGE=$(mktemp -d)
          mkdir -p $STAGE/web/dist $STAGE/server/dist $STAGE/build
          cp -r web/dist/. $STAGE/web/dist/
          # dist 整目录：server.mjs + builtin/ + playwright-core 运行期元数据（browsers.json /
          # package.json，bundle 内 registry init 按 packageRoot 读，缺则启动即崩，0.0.3 踩坑）
          cp -r server/dist/. $STAGE/server/dist/
          cp build/launcher.mjs build/versions.env $STAGE/build/
          cp rg-out/rg $STAGE/rg
          tar -czf anycode-core-linux-x64.tar.gz -C $STAGE .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: anycode-core-linux-x64.tar.gz

  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 桌面打包前置：web dist（extraResources.web-dist）+ domain/server 打包产物
      - name: Build workspace (web + server bundle)
        run: |
          pnpm --filter @any-code/web build
          pnpm --filter @any-code/server build

      - name: Stage desktop resources
        run: npm run stage
        working-directory: desktop

      - name: Build desktop main
        run: npm run build:main
        working-directory: desktop

      # electron-builder --publish：构建 AppImage/NSIS/zip 并上传到 GitHub Releases
      - name: Build & publish installer
        run: npx electron-builder --config electron-builder.config.js --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
