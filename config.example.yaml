# anycode 配置文件模板。
# 复制此文件到 <workspace>/.anycode/config.yaml 并填写。
# 所有配置只在此文件。

# 命名 provider：每个 provider 自带 apiKey / baseURL / model / streaming
providers:
  openai:
    apiKey: sk-your-key
    baseURL: https://api.openai.com/v1   # 可选
    model: gpt-4o
    streaming: true                       # 可选，缺省 true
  deepseek:
    apiKey: sk-your-deepseek-key
    baseURL: https://api.deepseek.com/v1
    model: deepseek-chat
    streaming: true

# 当前生效 provider（改后下次调用生效；web 可热更新）
default: openai

# MCP server 配置
# 每个 server：{ type: stdio, command, args?, env? } 或 { type: sse, url, headers? }
mcp:
  filesystem:
    type: stdio
    command: npx
    args: [-y, "@modelcontextprotocol/server-filesystem", /tmp]
  # remote:
  #   type: sse
  #   url: https://example.com/sse
  #   headers: { Authorization: "Bearer xxx" }
