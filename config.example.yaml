# anycode 配置文件模板。
# 复制此文件到 ~/.anycode/config.yaml 并填写。
# 所有配置只在此文件。

# 命名 provider：每个 provider 自带 apiKey / baseURL / models / defaultModel / streaming / contextWindow
providers:
  openai:
    apiKey: sk-your-key
    baseURL: https://api.openai.com/v1   # 可选
    streaming: true                       # 可选，缺省 true
    contextWindow: 128000                 # 可选，缺省 128000
    models:                               # 该 provider 支持的模型列表
      - id: gpt-4o                        # 调 API 的真实模型名
        name: GPT-4o                      # 展示名（可选）
      - id: gpt-4o-mini
        name: GPT-4o Mini
    defaultModel: gpt-4o                  # 当前生效模型 id
  deepseek:
    apiKey: sk-your-deepseek-key
    baseURL: https://api.deepseek.com/v1
    models:
      - id: deepseek-chat
    defaultModel: deepseek-chat

# 当前生效 provider（改后下次调用生效；web 可热更新）
default: openai

# MCP server 配置
# 每个 server：{ type: stdio, command, args?, env? } 或 { type: sse, url, headers? }
mcp:
  filesystem:
    type: stdio
    command: npx
    args: [-y, "@modelcontextprotocol/server-filesystem", /tmp]
  # remote:
  #   type: sse
  #   url: https://example.com/sse
  #   headers: { Authorization: "Bearer xxx" }

# 内置能力（abilities）开关（FE-022 / SPEC-031）——未配置 = 不启用；随包默认开启前三项。
# 每项 { enabled, config? }；config 是能力私有参数（连接器 provider/key/cdpUrl 等）。
abilities:
  web-fetch:
    enabled: true
  web-search:
    enabled: true
    config:
      provider: ddg            # ddg（无 key 默认，best-effort）/ tavily / bing
      # apiKey: ""             # tavily/bing 需要
  browser-use:
    enabled: true
  browser:                     # 真浏览器（CDP），默认关——需 cdpUrl
    enabled: false
    config:
      cdpUrl: ""               # chrome --remote-debugging-port=9222 后，取 ws://127.0.0.1:9222/devtools/page/<id>
