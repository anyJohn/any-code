# anycode 配置文件模板。
# 复制此文件到 ~/.anycode/config.yaml 并填写。
# 所有配置只在此文件。

# 命名 provider：每个 provider 自带 apiKey / baseURL / models / defaultModel / streaming / contextWindow
providers:
  openai:
    apiKey: sk-your-key
    baseURL: https://api.openai.com/v1 # 可选
    streaming: true # 可选，缺省 true
    contextWindow: 128000 # 可选，缺省 128000
    models: # 该 provider 支持的模型列表
      - id: gpt-4o # 调 API 的真实模型名
        name: GPT-4o # 展示名（可选）
      - id: gpt-4o-mini
        name: GPT-4o Mini
    defaultModel: gpt-4o # 当前生效模型 id
  deepseek:
    apiKey: sk-your-deepseek-key
    baseURL: https://api.deepseek.com/v1
    models:
      - id: deepseek-chat
    defaultModel: deepseek-chat

# 当前生效 provider（改后下次调用生效；web 可热更新）
default: openai

# MCP server 配置（第三方 MCP——默认关 enabled:false 不自动连，用户开 + 填 key/路径后启用 = 显式同意）
# 每个 server：{ type: stdio, command, args?, env?, enabled? } 或 { type: sse, url, headers?, enabled? }
# enabled 缺省=启用；enabled:false 保留定义但不建连（Settings 可开关）。filesystem 更适合项目级 .anycode/mcp.yaml
mcp:
  filesystem: # 示例：需指定根目录
    type: stdio
    command: npx
    args: [-y, "@modelcontextprotocol/server-filesystem", /tmp]
    enabled: false
  # fetch: # 零配置（默认关，开即用）
  #   type: stdio
  #   command: npx
  #   args: [-y, "@modelcontextprotocol/server-fetch"]
  #   enabled: false
  # github: # 需 GITHUB_PERSONAL_ACCESS_TOKEN
  #   type: stdio
  #   command: npx
  #   args: [-y, "@modelcontextprotocol/server-github"]
  #   env: { GITHUB_PERSONAL_ACCESS_TOKEN: "" }
  #   enabled: false
  # remote:
  #   type: sse
  #   url: https://example.com/sse
  #   headers: { Authorization: "Bearer xxx" }

# 内置能力（abilities）开关（FE-022 / SPEC-031）——未配置 = 不启用；随包默认开启 web-fetch/web-search。
# 内置能力 = 内置连接器（mcp）。技能是纯文件：直接放 ~/.anycode/skills/ 或项目 .anycode/skills/ 即可。
# 每项 { enabled, config? }；config 是连接器私有参数（provider/key/cdpUrl 等）。
abilities:
  web-fetch:
    enabled: true
  web-search:
    enabled: true
    config:
      provider: ddg # ddg（无 key 默认）/ tavily / bing
      # apiKey: ""             # tavily/bing 需要
  browser-use: # 真浏览器（CDP），默认关——需 cdpUrl
    enabled: false
    config:
      cdpUrl: http://127.0.0.1:9222 # chrome --remote-debugging-port=9222 后填此（连接器自动发现 page）
